site_name: Universal Commerce Protocol (UCP) 한국어 문서
site_url: https://jaichangpark.github.io/ucp-docs-ko/  # Required for the llmstxt plugin to work.
site_description: >
  Universal Commerce Protocol(UCP)은 생성형 AI 에이전트가 사용자를 대신해
  안전하고 신뢰할 수 있으며 분산형·프라이버시 보호 방식으로 결제를 수행할 수 있게 하는
  프로토콜입니다. UCP는 A2A, MCP 같은 에이전트 프로토콜 생태계와 함께 동작하며
  글로벌 결제 시나리오를 포괄합니다.
site_dir: site
edit_uri: edit/main/docs/

# Navigation
nav:
  - 홈: index.md
  - 핵심 개념: documentation/core-concepts.md
  - 플레이그라운드: playground.md
  - 명세:
    - 개요: specification/overview.md
    - 체크아웃 기능:
      - 개요: specification/checkout.md
      - HTTP/REST 바인딩: specification/checkout-rest.md
      - MCP 바인딩: specification/checkout-mcp.md
      - A2A 바인딩: specification/checkout-a2a.md
      - 임베디드 체크아웃 바인딩: specification/embedded-checkout.md
      - AP2 위임 확장: specification/ap2-mandates.md
      - 구매자 동의 확장: specification/buyer-consent.md
      - 할인 확장: specification/discount.md
      - 주문 이행 확장: specification/fulfillment.md
    - 장바구니 기능:
      - 개요: specification/cart.md
      - HTTP/REST 바인딩: specification/cart-rest.md
      - MCP 바인딩: specification/cart-mcp.md
    - 주문 기능: specification/order.md
    - 신원 연결 기능: specification/identity-linking.md
    - 결제 핸들러:
      - 가이드: specification/payment-handler-guide.md
      - 템플릿: specification/payment-handler-template.md
      - 토큰화 가이드: specification/tokenization-guide.md
      - 예시:
        - 프로세서 토크나이저: specification/examples/processor-tokenizer-payment-handler.md
        - 플랫폼 토크나이저: specification/examples/platform-tokenizer-payment-handler.md
        - 암호화 자격증명: specification/examples/encrypted-credential-handler.md
    - 스키마 작성: documentation/schema-authoring.md
    - 레퍼런스: specification/reference.md
    - 버저닝: specification/versioning.md
  - UCP와 AP2: documentation/ucp-and-ap2.md
  - 로드맵: documentation/roadmap.md
  - 번역 업데이트: translation-updates/index.md

repo_name: UCP 한국어 문서 저장소
repo_url: https://github.com/JAICHANGPARK/ucp-docs-ko

# Copyright
copyright: Copyright 2026 UCP Authors. Licensed under the <a href="https://github.com/JAICHANGPARK/ucp-docs-ko/blob/main/LICENSE">Apache License, Version 2.0</a>.

# Custom CSS
extra_css:
  - stylesheets/custom.css

#Global Constants
extra:
  ucp_version: "draft"
  ucp_url: https://ucp.dev
  analytics:
    provider: google
    # cSpell:disable
    property: G-ZEGTBCTMJ9
    # cSpell:enable
  consent:
    title: 쿠키 동의
    description: >-
      반복 방문 및 선호를 기억하고, 문서의 유효성과 검색 성공률을 측정하기 위해
      쿠키를 사용합니다. 동의해 주시면 한국어 문서를 더 정확하고 유용하게 개선하는 데
      도움이 됩니다.
  version:
    provider: mike

# Configuration
theme:
  logo: assets/updated-icon.svg
  favicon: assets/favicon.png
  name: material
  language: ko
  font:
    text: Google Sans
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    view: material/pencil-box-multiple
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  palette:
    - scheme: default
      primary: white
      accent: indigo
    - scheme: slate
      primary: black
      accent: indigo
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow

# Extensions
markdown_extensions:
  - meta
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      url_download: true
      dedent_subsections: true
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

# Custom hooks
hooks:
  - hooks.py

# Plugins
plugins:
  - search
  - macros:
      on_error_fail: true
  - site-urls
  - social
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Introduction:
          - index.md
          - documentation/core-concepts.md
        UCP and AP2:
          - documentation/ucp-and-ap2.md
        Playground:
          - playground.md
        Roadmap:
          - documentation/roadmap.md
        Specification Overview:
          - specification/overview.md
        Checkout Capability:
          - specification/checkout.md
          - specification/checkout-rest.md
          - specification/checkout-mcp.md
          - specification/checkout-a2a.md
        Checkout Extensions:
          - specification/ap2-mandates.md
          - specification/buyer-consent.md
          - specification/discount.md
          - specification/embedded-checkout.md
          - specification/fulfillment.md
        Cart Capability:
          - specification/cart.md
          - specification/cart-rest.md
          - specification/cart-mcp.md
        Order Capability:
          - specification/order.md
        Identity Linking Capability:
          - specification/identity-linking.md
        Payment Handlers:
          - specification/payment-handler-guide.md
          - specification/payment-handler-template.md
          - specification/tokenization-guide.md
        Payment Handler Examples:
          - specification/examples/processor-tokenizer-payment-handler.md
          - specification/examples/platform-tokenizer-payment-handler.md
          - specification/examples/encrypted-credential-handler.md
        Schema Authoring:
          - documentation/schema-authoring.md
        Reference:
          - specification/reference.md
